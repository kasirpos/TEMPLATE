<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Kasir - Multi Buyer</title>
    <meta http-equiv="refresh" content="0; url=./TEMPLATE/">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            color: #fff;
            text-align: center;
            padding: 20px;
        }
        .box { max-width: 400px; width: 100%; }
        .logo {
            width: 80px;
            height: 80px;
            background: rgba(0, 166, 255, 0.15);
            border: 2px solid #00A6FF;
            border-radius: 24px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin-bottom: 24px;
        }
        h1 { font-size: 28px; font-weight: 800; margin-bottom: 8px; }
        .subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 32px; }
        .loader {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid rgba(0, 166, 255, 0.2);
            border-radius: 50%;
            border-top-color: #00A6FF;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .redirect-text { color: #64748b; font-size: 12px; margin-bottom: 20px; }
        a {
            color: #00A6FF;
            text-decoration: none;
            font-weight: 700;
            font-size: 13px;
            padding: 12px 24px;
            border: 1px solid #00A6FF;
            border-radius: 12px;
            display: inline-block;
            transition: all 0.2s;
        }
        a:hover { background: #00A6FF; color: #fff; }
    </style>
</head>
<body>
    <div class="box">
        <div class="logo">🧾</div>
        <h1>POS Kasir</h1>
        <p class="subtitle">Multi Buyer Edition</p>
        <div class="loader"></div>
        <p class="redirect-text">Redirecting ke aplikasi...</p>
        <a href="./TEMPLATE/">Buka Aplikasi →</a>
    </div>
</body>
</html>
